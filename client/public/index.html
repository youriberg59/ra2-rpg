<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RA2 RPG — Isometric Prototype</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#f3f3f3;background:#111}
*{box-sizing:border-box} body{margin:0;overflow:hidden;background:#111}
#game{display:block;width:100vw;height:100vh;background:#182018;cursor:pointer}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{pointer-events:auto;background:rgba(12,14,12,.9);border:1px solid #777;box-shadow:0 5px 25px #0008}
#stats{position:absolute;left:14px;top:14px;padding:10px 12px;min-width:240px}
#quest{position:absolute;right:14px;top:14px;padding:10px 12px;width:300px}
#inventory{position:absolute;right:14px;bottom:14px;padding:10px 12px;width:300px}
#help{position:absolute;left:14px;bottom:14px;padding:8px 10px;background:rgba(0,0,0,.65)}
#toast{position:absolute;left:50%;top:24px;transform:translateX(-50%);padding:9px 14px;background:#111e;border:1px solid #aaa;opacity:0;transition:opacity .2s}
#dialogue{position:absolute;left:50%;bottom:50px;transform:translateX(-50%);width:min(620px,88vw);padding:16px;display:none}
#login{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000c;pointer-events:auto}
#loginBox{width:min(420px,90vw);padding:22px}
input,button{font:inherit;padding:9px} input{width:100%;margin:6px 0 12px;background:#202520;color:white;border:1px solid #888}
button{cursor:pointer;background:#505d43;color:#fff;border:1px solid #999;margin-right:6px} button:hover{background:#657556}
.muted{color:#bbb;font-size:.9rem}.bar{width:100%;height:10px;border:1px solid #777;background:#222;margin:4px 0 6px}.fill{height:100%;background:#aaa}
h2,h3,p{margin-top:0} #inventory button{padding:4px 7px;font-size:.85rem}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="stats" class="panel"></div>
  <div id="quest" class="panel"></div>
  <div id="inventory" class="panel"></div>
  <div id="help">Click ground: move · Click enemy: shoot · Click NPC: talk · Wheel: zoom</div>
  <div id="toast"></div>
  <div id="dialogue" class="panel">
    <h3 id="dialogueTitle"></h3><p id="dialogueText"></p><div id="dialogueActions"></div>
  </div>
  <div id="login">
    <div id="loginBox" class="panel">
      <h2>RA2 Action RPG — Isometric</h2>
      <p class="muted">Use the same Player ID to restore your saved character.</p>
      <label>Player ID</label><input id="playerId" value="commander1" maxlength="64">
      <label>Character name</label><input id="playerName" value="Commander" maxlength="20">
      <button id="join">Enter world</button>
    </div>
  </div>
</div>

<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const statsEl=document.getElementById("stats"),questEl=document.getElementById("quest"),inventoryEl=document.getElementById("inventory");
const toastEl=document.getElementById("toast"),dialogueEl=document.getElementById("dialogue"),dialogueTitle=document.getElementById("dialogueTitle");
const dialogueText=document.getElementById("dialogueText"),dialogueActions=document.getElementById("dialogueActions"),loginEl=document.getElementById("login");

let ws,me=null,manifest=null;
let state={players:[],enemies:[],npcs:[],quests:[],projectiles:[],world:{width:1600,height:1000,tileWidth:64,tileHeight:32,worldUnit:32},map:null};
let camera={x:0,y:0,zoom:1},lastClickPoint=null;
const images=new Map();

function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px"}
addEventListener("resize",resize);resize();

function toast(text){toastEl.textContent=text;toastEl.style.opacity=1;clearTimeout(toast.timer);toast.timer=setTimeout(()=>toastEl.style.opacity=0,2600)}
function send(data){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(data))}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

async function loadAssets(){
  manifest=await fetch("/assets/manifest.json").then(r=>r.json());
  const groups=["characters","buildings","props","loot","projectiles"];
  const entries=[];
  for(const group of groups) for(const [id,a] of Object.entries(manifest[group]||{})) entries.push([group,id,a]);
  await Promise.all(entries.map(([group,id,a])=>new Promise(resolve=>{
    const img=new Image(); img.onload=()=>{images.set(group+":"+id,img);resolve()}; img.onerror=resolve; img.src=a.src;
  })));
}
loadAssets().catch(console.error);

function asset(group,id){return manifest?.[group]?.[id]}
function imageFor(group,id){return images.get(group+":"+id)}

function worldToIso(x,y){
  const u=state.world.worldUnit||32,tw=state.world.tileWidth||64,th=state.world.tileHeight||32;
  return {x:((x-y)/u)*(tw/2),y:((x+y)/u)*(th/2)};
}
function isoToWorld(ix,iy){
  const u=state.world.worldUnit||32,tw=state.world.tileWidth||64,th=state.world.tileHeight||32;
  return {x:u*(ix/tw+iy/th),y:u*(-ix/tw+iy/th)};
}
function screenToWorld(sx,sy){
  const r=canvas.getBoundingClientRect();
  const ix=(sx-r.left-r.width/2)/camera.zoom+camera.x;
  const iy=(sy-r.top-r.height/2)/camera.zoom+camera.y;
  return isoToWorld(ix,iy);
}

document.getElementById("join").onclick=()=>{
  const playerId=document.getElementById("playerId").value.trim(),name=document.getElementById("playerName").value.trim();
  if(!playerId)return;
  const proto=location.protocol==="https:"?"wss":"ws"; ws=new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen=()=>send({type:"hello",playerId,name});
  ws.onmessage=ev=>{
    const msg=JSON.parse(ev.data);
    if(msg.type==="welcome"){me=msg.player;loginEl.style.display="none";state.quests=msg.quests;state.npcs=msg.npcs;state.world=msg.world;state.map=msg.map}
    if(msg.type==="state"){state=msg;const fresh=state.players.find(p=>p.id===me?.id);if(fresh)me=fresh;refreshHud()}
    if(msg.type==="toast")toast(msg.text);
    if(msg.type==="error")toast(msg.text);
    if(msg.type==="dialogue")showDialogue(msg);
  };
  ws.onclose=()=>toast("Disconnected from server.");
};

function showDialogue(msg){
  dialogueEl.style.display="block";dialogueTitle.textContent=msg.npc;dialogueText.textContent=msg.text;dialogueActions.innerHTML="";
  if(msg.questOffer){const b=document.createElement("button");b.textContent="Accept: "+msg.questOffer.title;b.onclick=()=>{send({type:"acceptQuest",questId:msg.questOffer.id});dialogueEl.style.display="none"};dialogueActions.appendChild(b)}
  const close=document.createElement("button");close.textContent="Close";close.onclick=()=>dialogueEl.style.display="none";dialogueActions.appendChild(close);
}
function refreshHud(){
  if(!me)return;
  statsEl.innerHTML=`<strong>${escapeHtml(me.name)}</strong> · Level ${me.level}<br>HP ${me.hp}/${me.maxHp}<div class="bar"><div class="fill" style="width:${100*me.hp/me.maxHp}%"></div></div>XP ${me.xp}/${me.level*100}<br>Credits $${me.credits}`;
  const active=Object.entries(me.questState||{}).filter(([,v])=>v.status!=="completed");
  if(!active.length)questEl.innerHTML='<strong>Quest</strong><p class="muted">Talk to Boris in town.</p>';
  else{const[qid,qs]=active[0],q=state.quests.find(x=>x.id===qid);const obj=q?q.objectives.map((o,i)=>`${qs.progress?.[i]||0}/${o.count} ${o.target}`).join("<br>"):"";questEl.innerHTML=`<strong>${escapeHtml(q?.title||qid)}</strong><p>${obj}</p><span class="muted">${qs.status==="ready"?"Return to the quest giver.":"In progress"}</span>`}
  const counts={};for(const item of me.inventory||[])counts[item]=(counts[item]||0)+1;
  inventoryEl.innerHTML="<strong>Inventory</strong><br>"+Object.entries(counts).map(([item,count])=>`${escapeHtml(item)} ×${count}${item==="medkit"?` <button onclick="useItem('${item}')">Use</button>`:""}`).join("<br>");
}
window.useItem=item=>send({type:"useItem",item});

canvas.addEventListener("wheel",e=>{e.preventDefault();camera.zoom=Math.max(.45,Math.min(2.1,camera.zoom*(e.deltaY>0?.92:1.08)))},{passive:false});

canvas.addEventListener("click",e=>{
  if(!me)return;
  const p=screenToWorld(e.clientX,e.clientY);
  const npc=state.npcs.find(n=>Math.hypot(n.x-p.x,n.y-p.y)<42);
  if(npc){send({type:"interactNpc",npcId:npc.id});return}
  const enemy=state.enemies.filter(x=>x.alive).find(x=>Math.hypot(x.x-p.x,x.y-p.y)<48);
  if(enemy){send({type:"attack",enemyId:enemy.id});return}
  lastClickPoint={x:p.x,y:p.y,time:Date.now()};send({type:"moveTo",x:p.x,y:p.y});
});

function drawDiamond(ix,iy,fill,stroke="#253225"){
  const tw=state.world.tileWidth||64,th=state.world.tileHeight||32;
  ctx.beginPath();ctx.moveTo(ix,iy-th/2);ctx.lineTo(ix+tw/2,iy);ctx.lineTo(ix,iy+th/2);ctx.lineTo(ix-tw/2,iy);ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=.6;ctx.stroke();
}
function roadAt(x,y){
  for(const r of state.map?.ground?.roads||[]){
    if(r.x1===r.x2&&y>=Math.min(r.y1,r.y2)&&y<=Math.max(r.y1,r.y2)&&Math.abs(x-r.x1)<=r.width/2)return true;
    if(r.y1===r.y2&&x>=Math.min(r.x1,r.x2)&&x<=Math.max(r.x1,r.x2)&&Math.abs(y-r.y1)<=r.width/2)return true;
  }
  return false;
}
function drawGround(){
  const u=state.world.worldUnit||32,cols=Math.ceil(state.world.width/u),rows=Math.ceil(state.world.height/u);
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const wx=x*u+u/2,wy=y*u+u/2,p=worldToIso(wx,wy),road=roadAt(wx,wy);
    drawDiamond(p.x,p.y,road?"#777263":((x+y)%2?"#526c45":"#58734a"),road?"#625e53":"#46603c");
  }
}
function drawSprite(group,id,x,y,label=null,hp=null,maxHp=null){
  const a=asset(group,id),img=imageFor(group,id),p=worldToIso(x,y);
  if(a&&img){const w=a.width,h=a.height,ax=a.anchorX??.5,ay=a.anchorY??1;ctx.drawImage(img,p.x-w*ax,p.y-h*ay,w,h)}
  else{ctx.fillStyle="#ddd";ctx.beginPath();ctx.arc(p.x,p.y-18,12,0,Math.PI*2);ctx.fill()}
  if(label){ctx.font="12px Arial";ctx.textAlign="center";ctx.fillStyle="#fff";ctx.strokeStyle="#000";ctx.lineWidth=3;ctx.strokeText(label,p.x,p.y-60);ctx.fillText(label,p.x,p.y-60)}
  if(hp!=null&&maxHp){ctx.fillStyle="#151515";ctx.fillRect(p.x-20,p.y-52,40,5);ctx.fillStyle="#ddd";ctx.fillRect(p.x-20,p.y-52,40*Math.max(0,hp/maxHp),5)}
}
function drawRenderable(r){
  if(r.kind==="map"){
    const a=(manifest?.buildings?.[r.asset]?"buildings":"props");drawSprite(a,r.asset,r.x,r.y);
  } else if(r.kind==="npc") drawSprite("characters","boris",r.x,r.y,r.name);
  else if(r.kind==="enemy") drawSprite("characters","bandit",r.x,r.y,r.name,r.hp,r.maxHp);
  else if(r.kind==="player") drawSprite("characters","player",r.x,r.y,r.name,r.hp,r.maxHp);
  else if(r.kind==="projectile"){
    const p=worldToIso(r.x,r.y),a=asset("projectiles","bullet"),img=imageFor("projectiles","bullet");
    if(a&&img)ctx.drawImage(img,p.x-a.width/2,p.y-a.height/2,a.width,a.height);
    else{ctx.fillStyle="#ffe47c";ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill()}
  }
}
function drawWorld(){
  if(!me)return;
  const rect=canvas.getBoundingClientRect(),focus=worldToIso(me.x,me.y);
  camera.x+=(focus.x-camera.x)*.08;camera.y+=(focus.y-camera.y)*.08;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.clearRect(0,0,rect.width,rect.height);
  ctx.save();ctx.translate(rect.width/2,rect.height/2);ctx.scale(camera.zoom,camera.zoom);ctx.translate(-camera.x,-camera.y);
  drawGround();

  const renderables=[];
  for(const o of state.map?.objects||[])renderables.push({kind:"map",...o,depth:o.x+o.y});
  for(const n of state.npcs||[])renderables.push({kind:"npc",...n,depth:n.x+n.y});
  for(const e of state.enemies||[])if(e.alive)renderables.push({kind:"enemy",...e,depth:e.x+e.y});
  for(const p of state.players||[])renderables.push({kind:"player",...p,depth:p.x+p.y});
  for(const p of state.projectiles||[])renderables.push({kind:"projectile",...p,depth:p.x+p.y+.1});
  renderables.sort((a,b)=>a.depth-b.depth);for(const r of renderables)drawRenderable(r);

  if(lastClickPoint&&Date.now()-lastClickPoint.time<700){
    const age=(Date.now()-lastClickPoint.time)/700,p=worldToIso(lastClickPoint.x,lastClickPoint.y);
    ctx.globalAlpha=1-age;ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(p.x,p.y,16+age*10,8+age*5,0,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
  }
  ctx.restore();
}
function frame(){drawWorld();requestAnimationFrame(frame)} frame();
</script>
</body>
</html>
