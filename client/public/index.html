<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RA2 RPG Prototype</title>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; color: #f3f3f3; background: #111; }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; }
    #game { display:block; width:100vw; height:100vh; background:#243421; cursor:crosshair; }
    #hud { position:fixed; inset:0; pointer-events:none; }
    .panel { pointer-events:auto; background:rgba(12,14,12,.9); border:1px solid #777; box-shadow:0 5px 25px #0008; }
    #stats { position:absolute; left:14px; top:14px; padding:10px 12px; min-width:240px; }
    #quest { position:absolute; right:14px; top:14px; padding:10px 12px; width:300px; }
    #inventory { position:absolute; right:14px; bottom:14px; padding:10px 12px; width:300px; }
    #help { position:absolute; left:14px; bottom:14px; padding:8px 10px; background:rgba(0,0,0,.65); }
    #toast { position:absolute; left:50%; top:24px; transform:translateX(-50%); padding:9px 14px; background:#111e; border:1px solid #aaa; opacity:0; transition:opacity .2s; }
    #dialogue { position:absolute; left:50%; bottom:50px; transform:translateX(-50%); width:min(620px,88vw); padding:16px; display:none; }
    #login { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#000c; pointer-events:auto; }
    #loginBox { width:min(420px,90vw); padding:22px; }
    input, button { font:inherit; padding:9px; }
    input { width:100%; margin:6px 0 12px; background:#202520; color:white; border:1px solid #888; }
    button { cursor:pointer; background:#505d43; color:#fff; border:1px solid #999; margin-right:6px; }
    button:hover { background:#657556; }
    .muted { color:#bbb; font-size:.9rem; }
    .bar { width:100%; height:10px; border:1px solid #777; background:#222; margin:4px 0 6px; }
    .fill { height:100%; background:#aaa; }
    h2,h3,p { margin-top:0; }
    #inventory button { padding:4px 7px; font-size:.85rem; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="stats" class="panel"></div>
  <div id="quest" class="panel"></div>
  <div id="inventory" class="panel"></div>
  <div id="help">WASD / arrows: move · Click enemy: attack · Click NPC: talk · Mouse wheel: zoom</div>
  <div id="toast"></div>

  <div id="dialogue" class="panel">
    <h3 id="dialogueTitle"></h3>
    <p id="dialogueText"></p>
    <div id="dialogueActions"></div>
  </div>

  <div id="login">
    <div id="loginBox" class="panel">
      <h2>RA2 Action RPG Prototype</h2>
      <p class="muted">Use the same Player ID next time to restore your saved character. Open a second browser/private window with another ID to test multiplayer.</p>
      <label>Player ID</label>
      <input id="playerId" value="commander1" maxlength="64" />
      <label>Character name</label>
      <input id="playerName" value="Commander" maxlength="20" />
      <button id="join">Enter world</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const statsEl = document.getElementById("stats");
const questEl = document.getElementById("quest");
const inventoryEl = document.getElementById("inventory");
const toastEl = document.getElementById("toast");
const dialogueEl = document.getElementById("dialogue");
const dialogueTitle = document.getElementById("dialogueTitle");
const dialogueText = document.getElementById("dialogueText");
const dialogueActions = document.getElementById("dialogueActions");
const loginEl = document.getElementById("login");

let ws;
let me = null;
let state = { players:[], enemies:[], npcs:[], quests:[], world:{width:1600,height:1000} };
let keys = new Set();
let camera = { x:0, y:0, zoom:1 };

function resize() {
  canvas.width = innerWidth * devicePixelRatio;
  canvas.height = innerHeight * devicePixelRatio;
  canvas.style.width = innerWidth + "px";
  canvas.style.height = innerHeight + "px";
}
addEventListener("resize", resize);
resize();

function toast(text) {
  toastEl.textContent = text;
  toastEl.style.opacity = 1;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => toastEl.style.opacity = 0, 2600);
}

function send(data) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(data));
}

document.getElementById("join").onclick = () => {
  const playerId = document.getElementById("playerId").value.trim();
  const name = document.getElementById("playerName").value.trim();
  if (!playerId) return;

  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => send({ type:"hello", playerId, name });
  ws.onmessage = ev => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "welcome") {
      me = msg.player;
      loginEl.style.display = "none";
      state.quests = msg.quests;
      state.npcs = msg.npcs;
      state.world = msg.world;
    }
    if (msg.type === "state") {
      state = msg;
      const fresh = state.players.find(p => p.id === me?.id);
      if (fresh) me = fresh;
      refreshHud();
    }
    if (msg.type === "toast") toast(msg.text);
    if (msg.type === "error") toast(msg.text);
    if (msg.type === "dialogue") showDialogue(msg);
  };
  ws.onclose = () => toast("Disconnected from server.");
};

function showDialogue(msg) {
  dialogueEl.style.display = "block";
  dialogueTitle.textContent = msg.npc;
  dialogueText.textContent = msg.text;
  dialogueActions.innerHTML = "";

  if (msg.questOffer) {
    const b = document.createElement("button");
    b.textContent = `Accept: ${msg.questOffer.title}`;
    b.onclick = () => {
      send({ type:"acceptQuest", questId: msg.questOffer.id });
      dialogueEl.style.display = "none";
    };
    dialogueActions.appendChild(b);
  }

  const close = document.createElement("button");
  close.textContent = "Close";
  close.onclick = () => dialogueEl.style.display = "none";
  dialogueActions.appendChild(close);
}

function refreshHud() {
  if (!me) return;
  statsEl.innerHTML = `
    <strong>${escapeHtml(me.name)}</strong> · Level ${me.level}<br>
    HP ${me.hp}/${me.maxHp}
    <div class="bar"><div class="fill" style="width:${100*me.hp/me.maxHp}%"></div></div>
    XP ${me.xp}/${me.level*100}<br>
    Credits $${me.credits}
  `;

  const active = Object.entries(me.questState || {}).filter(([,v]) => v.status !== "completed");
  if (!active.length) {
    questEl.innerHTML = `<strong>Quest</strong><p class="muted">Talk to Boris in town.</p>`;
  } else {
    const [qid, qs] = active[0];
    const q = state.quests.find(x => x.id === qid);
    let obj = "";
    if (q) obj = q.objectives.map((o,i) => `${qs.progress?.[i] || 0}/${o.count} ${o.target}`).join("<br>");
    questEl.innerHTML = `<strong>${escapeHtml(q?.title || qid)}</strong><p>${obj}</p><span class="muted">${qs.status === "ready" ? "Return to the quest giver." : "In progress"}</span>`;
  }

  const counts = {};
  for (const item of me.inventory || []) counts[item] = (counts[item] || 0) + 1;
  inventoryEl.innerHTML = `<strong>Inventory</strong><br>` +
    Object.entries(counts).map(([item, count]) => {
      const use = item === "medkit" ? ` <button onclick="useItem('${item}')">Use</button>` : "";
      return `${escapeHtml(item)} ×${count}${use}`;
    }).join("<br>");
}

window.useItem = item => send({ type:"useItem", item });

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

addEventListener("keydown", e => {
  if (["INPUT","BUTTON"].includes(document.activeElement.tagName)) return;
  keys.add(e.key.toLowerCase());
});
addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));

setInterval(() => {
  if (!me) return;
  let dx = 0, dy = 0;
  if (keys.has("w") || keys.has("arrowup")) dy--;
  if (keys.has("s") || keys.has("arrowdown")) dy++;
  if (keys.has("a") || keys.has("arrowleft")) dx--;
  if (keys.has("d") || keys.has("arrowright")) dx++;
  if (dx || dy) send({ type:"move", dx, dy });
}, 50);

canvas.addEventListener("wheel", e => {
  e.preventDefault();
  camera.zoom = Math.max(.55, Math.min(1.8, camera.zoom * (e.deltaY > 0 ? .92 : 1.08)));
}, { passive:false });

function screenToWorld(sx, sy) {
  const rect = canvas.getBoundingClientRect();
  const x = (sx - rect.left - rect.width/2) / camera.zoom + camera.x;
  const y = (sy - rect.top - rect.height/2) / camera.zoom + camera.y;
  return {x,y};
}

canvas.addEventListener("click", e => {
  if (!me) return;
  const p = screenToWorld(e.clientX, e.clientY);

  const npc = state.npcs.find(n => Math.hypot(n.x-p.x,n.y-p.y) < 30);
  if (npc) {
    send({ type:"interactNpc", npcId:npc.id });
    return;
  }

  const enemy = state.enemies
    .filter(x => x.alive)
    .find(x => Math.hypot(x.x-p.x,x.y-p.y) < 34);
  if (enemy) send({ type:"attack", enemyId:enemy.id });
});

function drawWorld() {
  if (!me) return;

  const rect = canvas.getBoundingClientRect();
  camera.x += (me.x - camera.x) * .08;
  camera.y += (me.y - camera.y) * .08;

  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  ctx.clearRect(0,0,rect.width,rect.height);

  ctx.save();
  ctx.translate(rect.width/2, rect.height/2);
  ctx.scale(camera.zoom, camera.zoom);
  ctx.translate(-camera.x, -camera.y);

  ctx.fillStyle = "#465c3c";
  ctx.fillRect(0,0,state.world.width,state.world.height);

  ctx.fillStyle = "#6b6658";
  ctx.fillRect(0, 410, state.world.width, 120);
  ctx.fillRect(600, 0, 120, state.world.height);

  drawZone(220,160,620,500,"#596c56","TOWN");
  for (const b of [
    [270,210,120,80],[470,210,150,90],[670,220,110,75],
    [280,540,140,80],[500,555,110,65],[680,550,120,70]
  ]) {
    ctx.fillStyle = "#777466";
    ctx.fillRect(...b);
    ctx.strokeStyle="#1c1c1c";
    ctx.strokeRect(...b);
  }

  drawZone(1030,220,390,390,"#4b4f45","OLD RADAR STATION");
  ctx.fillStyle="#87877f";
  ctx.fillRect(1190,330,110,80);
  ctx.strokeStyle="#222";
  ctx.strokeRect(1190,330,110,80);
  ctx.beginPath();
  ctx.arc(1245,320,42,Math.PI,0);
  ctx.stroke();

  for (let i=0;i<45;i++){
    const x=(i*193)%1500+40, y=(i*317)%900+30;
    if (x>950 && x<1450 && y>180 && y<650) continue;
    ctx.fillStyle="#263d22";
    ctx.beginPath(); ctx.arc(x,y,12,0,Math.PI*2); ctx.fill();
  }

  for (const n of state.npcs) {
    drawUnit(n.x,n.y,"#d8c36d",n.name,13);
  }

  for (const e of state.enemies) {
    if (!e.alive) continue;
    drawUnit(e.x,e.y,"#9c3131",e.name,14);
    drawHpBar(e.x,e.y-25,e.hp/e.maxHp);
  }

  for (const p of state.players) {
    const mine = p.id === me.id;
    drawUnit(p.x,p.y,mine ? "#6fd2ff" : "#e2e2e2",p.name,15);
    drawHpBar(p.x,p.y-27,p.hp/p.maxHp);
  }

  ctx.restore();
}

function drawZone(x,y,w,h,color,label){
  ctx.fillStyle=color; ctx.fillRect(x,y,w,h);
  ctx.strokeStyle="#222"; ctx.lineWidth=4; ctx.strokeRect(x,y,w,h);
  ctx.fillStyle="#111"; ctx.font="18px Arial"; ctx.fillText(label,x+12,y+24);
}

function drawUnit(x,y,color,label,r){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle="#111";
  ctx.lineWidth=2;
  ctx.stroke();
  ctx.fillStyle="#fff";
  ctx.font="13px Arial";
  ctx.textAlign="center";
  ctx.fillText(label,x,y-22);
}

function drawHpBar(x,y,ratio){
  ctx.fillStyle="#111"; ctx.fillRect(x-20,y,40,5);
  ctx.fillStyle="#bbb"; ctx.fillRect(x-20,y,40*Math.max(0,ratio),5);
}

function frame(){
  drawWorld();
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
