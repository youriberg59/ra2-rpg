services:
  ra2-web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:3000"
    volumes:
      - ./original-game:/app/public/original-game:ro
      - ./patches:/workspace/patches:ro
    environment:
      RA2_ORIGINAL_WEB_PATH: /original-game
    restart: unless-stopped
